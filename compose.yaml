services:
  app:
    build: .
    container_name: digital-twin-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - KAFKA_ENABLED=true
      - SPARK_ENABLED=true
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - kafka
    volumes:
      # Persist benchmark results and dataset between restarts
      - twin-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - twin-net
    depends_on:
      kafka:
        condition: service_healthy

  # Kafka broker (KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: digital-twin-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - twin-net

  spark:
    image: apache/spark:3.5.3
    container_name: digital-twin-spark
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/cmdline && grep -aq spark /proc/1/cmdline"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - /opt/project/spark_streaming_job.py
    volumes:
      - ./streaming/spark_streaming_job.py:/opt/project/spark_streaming_job.py:ro
    networks:
      - twin-net

networks:
  twin-net:
    driver: bridge

volumes:
  twin-data:
    name: digital-twin-data
